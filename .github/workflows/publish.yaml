name: publish

# GHCR publish (plan M0-T3). Trusted pushes to main only — PRs build
# the image in ci.yaml without pushing.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push ghcr.io/dlukt/voxilian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/voxilian
          file: backend/voxilian/Dockerfile
          push: true
          tags: |
            ghcr.io/dlukt/voxilian:main
            ghcr.io/dlukt/voxilian:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
