name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build/vet/fmt/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/voxilian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/voxilian/go.mod
          cache: true
          cache-dependency-path: backend/voxilian/go.sum
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: git diff --exit-code -- internal/store/gen
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend/voxilian
          file: backend/voxilian/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # M1 migration validation: the compiled binary runs embedded
  # migrations against a fresh service PG18 (replaces the M0 shell-level
  # pg-smoke; testcontainers coverage continues inside the go job).
  migration:
    name: embedded migration run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vox
          POSTGRES_PASSWORD: voxdev
          POSTGRES_DB: voxilian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vox -d voxilian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VOX_PG_DSN: postgres://vox:voxdev@127.0.0.1:5432/voxilian?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/voxilian/go.mod
          cache: true
          cache-dependency-path: backend/voxilian/go.sum
      - run: go build -o /tmp/voxilian .
        working-directory: backend/voxilian
      - run: cd /tmp && ./voxilian migrate up
      - run: cd /tmp && ./voxilian migrate status
      - run: cd /tmp && ./voxilian migrate up
      - run: cd /tmp && ./voxilian migrate status | tee /tmp/vox-status.txt
      - run: grep -q 'current=5 target=5 pending=0' /tmp/vox-status.txt

  # GHCR publish, gated on all validation jobs above. Trusted pushes to
  # main only — PRs build the image in `docker` without pushing.
  publish:
    name: publish ghcr.io/dlukt/voxilian
    runs-on: ubuntu-latest
    needs: [go, docker, migration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/voxilian
          file: backend/voxilian/Dockerfile
          push: true
          tags: |
            ghcr.io/dlukt/voxilian:main
            ghcr.io/dlukt/voxilian:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
