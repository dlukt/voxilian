name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go build/vet/fmt/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/voxilian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/voxilian/go.mod
          cache: true
          cache-dependency-path: backend/voxilian/go.sum
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: git diff --exit-code -- backend/voxilian/internal/store/gen
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend/voxilian
          file: backend/voxilian/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Proves the runner can execute containers for the future M0-T4
  # testcontainers suites. Real PG smoke, independent of Voxilian
  # migrations (which do not exist until M1).
  pg-smoke:
    name: postgres container smoke
    runs-on: ubuntu-latest
    steps:
      - run: docker run -d --name vox-pg-smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke postgres:18-alpine
      - run: |
          for i in $(seq 1 30); do
            docker exec vox-pg-smoke pg_isready -U postgres -d smoke && break
            sleep 2
          done
          docker exec vox-pg-smoke pg_isready -U postgres -d smoke
          docker exec vox-pg-smoke psql -U postgres -d smoke -tAc 'show server_version;'
      - run: docker rm -f vox-pg-smoke
        if: always()

  # GHCR publish, gated on all validation jobs above. Trusted pushes to
  # main only — PRs build the image in `docker` without pushing.
  publish:
    name: publish ghcr.io/dlukt/voxilian
    runs-on: ubuntu-latest
    needs: [go, docker, pg-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/voxilian
          file: backend/voxilian/Dockerfile
          push: true
          tags: |
            ghcr.io/dlukt/voxilian:main
            ghcr.io/dlukt/voxilian:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
