name: voxilian

# Development stack (plan M0-T3). Pre-M1 topology rule: NOTHING in the
# default `compose up` path may depend on a command that intentionally
# fails (migrate stub until M1-T8, serve stub until M3). M1-T8 promotes
# `migrate` to a real startup dependency and M3 promotes `app`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: voxdev
      POSTGRES_DB: voxilian
    volumes:
      # PG18+ images refuse a mount directly on the data dir; mount the
      # parent so versioned data subdirs are managed by the image.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d voxilian"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in until M1-T8: real `voxilian migrate up` one-shot against the
  # existing prod PG (spec §10). Run explicitly:
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # ENTRYPOINT is the binary itself, so this is argv, not a shell line.
    command: ["migrate", "up"]
    environment:
      VOX_PG_DSN: postgres://vox:voxdev@postgres:5432/voxilian?sslmode=disable
    restart: "no"

  # Opt-in until serve exists (M3): the binary runs but `serve` is a
  # fail-loud stub, so this service is NOT part of default startup.
  app:
    profiles: ["tools"]
    build: .
    environment:
      VOX_PG_DSN: postgres://vox:voxdev@postgres:5432/voxilian?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
