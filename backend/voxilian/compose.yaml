name: voxilian

# Development stack. M1-T8: default `compose up` brings postgres (healthy)
# then the migrate one-shot; app stays profile-gated until serve (M3).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: voxdev
      POSTGRES_DB: voxilian
    volumes:
      # PG18+ images refuse a mount directly on the data dir; mount the
      # parent so versioned data subdirs are managed by the image.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d voxilian"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migration init (M1-T8): real `voxilian migrate up` one-shot against
  # the compose postgres. Default startup so `compose up` always lands on
  # a migrated database. The app service (serve stub until M3) stays
  # profile-gated but correctly depends on this completing.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # ENTRYPOINT is the binary itself, so this is argv, not a shell line.
    command: ["migrate", "up"]
    environment:
      VOX_PG_DSN: postgres://vox:voxdev@postgres:5432/voxilian?sslmode=disable
    restart: "no"

  # Opt-in until serve exists (M3): the binary runs but `serve` is a
  # fail-loud stub, so this service is NOT part of default startup.
  app:
    profiles: ["tools"]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      VOX_PG_DSN: postgres://vox:voxdev@postgres:5432/voxilian?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  pgdata:
